<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>NetApp 存储巡检报告生成器</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{
      --theme:#2f7bff;
      --theme-dark:#1b5fd8;
      --bg:#f5f7fa;
      --card:#fff;
      --radius:8px;
      --text:#333;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;}
    body{background:var(--bg);color:var(--text);padding-bottom:60px}
    /* 顶部 */
    header{
      position:sticky;top:0;z-index:9;
      background:var(--theme);color:#fff;
      display:flex;align-items:center;justify-content:center;
      padding:.8rem;font-size:1.1rem;font-weight:500;
    }
    /* 上传区 */
    .upload-area{
      margin:.8rem;padding:2rem 1rem;
      background:var(--card);border-radius:var(--radius);
      text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05);
      border:2px dashed #ccd4e0;transition:.2s;
    }
    .upload-area.dragover{border-color:var(--theme);background:#f0f5ff;}
    .upload-area i{font-size:2.4rem;color:var(--theme);}
    .upload-area p{margin:.4rem 0;font-size:.95rem;color:#666;}
    #fileInput{display:none;}
    .btn{
      display:inline-block;padding:.5rem 1.2rem;background:var(--theme);color:#fff;border-radius:var(--radius);
      font-size:.9rem;border:0;outline:0;cursor:pointer;
    }
    .btn:active{background:var(--theme-dark);}
    /* 进度条 */
    .progress{display:none;margin-top:1rem;height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden;}
    .progress-bar{height:100%;background:var(--theme);width:0%;transition:width .3s;}
    /* 结果区 */
    .result{display:none;margin:.8rem;padding:1rem;background:var(--card);border-radius:var(--radius);box-shadow:0 2px 6px rgba(0,0,0,.05);}
    .result h3{margin-bottom:.4rem;font-size:1rem;}
    .result p{font-size:.85rem;color:#666;margin-bottom:.6rem;}
    /* 底部提示 */
    .footer-tip{text-align:center;font-size:.8rem;color:#999;padding:1rem;}
  </style>
</head>
<body>
  <header><i class="ri-file-list-3-line"></i>&nbsp;NetApp 巡检报告生成</header>

  <!-- 上传区 -->
  <div class="upload-area" id="uploadArea">
    <i class="ri-upload-cloud-2-line"></i>
    <p>拖拽日志文件到此处<br>或点击选择文件</p>
    <button class="btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
    <input type="file" id="fileInput" accept=".log,.txt,.gz">
    <div class="progress" id="progressBar">
      <div class="progress-bar" id="progressFill"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="result" id="resultBox">
    <h3><i class="ri-checkbox-circle-line" style="color:#2f7bff"></i> 生成成功</h3>
    <p id="resultText"></p>
    <a class="btn" id="downloadBtn" href="#" download="NetApp巡检报告.pdf">下载 PDF</a>
  </div>

  <!-- 页脚提示 -->
  <div class="footer-tip">支持 .log / .txt / .gz 格式，文件最大 20 MB</div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput  = document.getElementById('fileInput');
    const progressBar= document.getElementById('progressBar');
    const progressFill=document.getElementById('progressFill');
    const resultBox  = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const downloadBtn= document.getElementById('downloadBtn');

    /* 拖拽上传 */
    uploadArea.addEventListener('dragover', e=>{e.preventDefault();uploadArea.classList.add('dragover');});
    uploadArea.addEventListener('dragleave', ()=>uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e=>{
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if(files.length) handleFile(files[0]);
    });
    fileInput.addEventListener('change', e=>handleFile(e.target.files[0]));

    /* 统一处理文件 */
    function handleFile(file){
      if(!file) return;
      const allow = ['text/plain','application/octet-stream','application/gzip','text/x-log'];
      if(!allow.includes(file.type) && !/\.(log|txt|gz)$/i.test(file.name)){
        alert('请上传 .log / .txt / .gz 格式');
        return;
      }
      if(file.size > 20*1024*1024){ alert('文件大小不能超过 20 MB'); return; }

      uploadFile(file);
    }

    /* 上传 & 进度 */
    function uploadFile(file){
      const xhr = new XMLHttpRequest();
      const form = new FormData();
      form.append('log', file);

      xhr.open('POST', 'https://你的后端地址/api/netapp-report'); // ← 改成真实接口
      xhr.upload.onprogress = e=>{
        if(e.lengthComputable){
          const pct = Math.round(e.loaded/e.total*100);
          progressFill.style.width = pct + '%';
        }
      };
      xhr.onload = ()=>{
        progressBar.style.display = 'none';
        if(xhr.status === 200){
          const res = JSON.parse(xhr.responseText);
          showResult(res);
        }else{
          alert('生成失败：'+xhr.responseText);
        }
      };
      xhr.onerror = ()=>{ progressBar.style.display = 'none'; alert('网络错误，请重试'); };
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';
      xhr.send(form);
    }

    /* 展示结果 */
    function showResult(res){
      resultText.textContent = `文件：${res.filename}，生成时间：${res.time}，页数：${res.pages}`;
      downloadBtn.href = res.pdf_url; // 后端返回的 pdf 直链
      resultBox.style.display = 'block';
    }
  </script>
</body>
</html>
